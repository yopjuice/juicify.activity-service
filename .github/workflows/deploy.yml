name: Deploy to Local Machine

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: local-ubuntu # local runner
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_DB: ${{ secrets.DATABASE_DB }}
      GRPC_HOST: ${{ secrets.GRPC_HOST }}
      GRPC_PORT: ${{ secrets.GRPC_PORT }}
      RMQ_HOST: ${{ secrets.RMQ_HOST }}
      RMQ_PORT: ${{ secrets.RMQ_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Make sure pnpm is installed
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Copy source files to deploy folder
        run: |
          mkdir -p ~/juicify-deploy/activity
          rsync -vrax --delete --exclude='node_modules' ./ ~/juicify-deploy/activity/
          cd ~/juicify-deploy/activity

      # Install dependencies
      - name: Install dependencies
        run: |
          pnpm store prune
          cd ~/juicify-deploy/activity
          pnpm install --frozen-lockfile
          pnpm update @juice11-micro/contracts

      # Generate /generated folder with SQL queries
      - name: Generate SQL Types
        run: |
          cd ~/juicify-deploy/activity
          pnpm run db:types

      # Compile code
      - name: Build application
        run: |
          cd ~/juicify-deploy/activity
          pnpm build

      # Start application with pm2
      - name: Start/Restart Application
        run: |
          cd ~/juicify-deploy/activity
          pm2 restart "juicify-activity" --update-env || pm2 start dist/main.js --name "juicify-activity"
